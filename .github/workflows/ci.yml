name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m spacy download en_core_web_md

      - name: Lint
        run: ruff check app synth tests tools

      - name: Test
        run: pytest -p no:warnings

      - name: Corpus is reproducible from its manifest
        run: python tools/check_frozen_corpus.py

  # The regression gate. Fails the build when micro-F1 falls more than a set
  # margin below the committed baseline, and when any per-class floor is
  # breached -- a gate on the aggregate alone would have passed v1's validated
  # run cheerfully while IFSC precision fell 37 points.
  #
  # TODO: enable once tools/evaluate.py and baseline.json land. The step is
  # present so the slot is visible rather than forgotten.
  eval-gate:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder
        run: echo "pending -- evaluate against the frozen corpus and compare to baseline.json"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t mortgage-pii:ci .
      - name: Record image size
        run: |
          docker image inspect mortgage-pii:ci --format '{{.Size}}' \
            | awk '{printf "image size %.0f MB\n", $1/1048576}'
      - name: Starts cold with no network
        run: |
          docker run -d --name pii --network none -p 8000:8000 mortgage-pii:ci
          for i in $(seq 1 60); do
            if docker exec pii python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=2)" 2>/dev/null; then
              echo "ready with no network after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "container never became ready without network access"
          docker logs pii
          exit 1
