name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m spacy download en_core_web_md

      - name: Lint
        run: ruff check app synth evaluation tests tools

      - name: Test
        run: pytest -p no:warnings

      - name: Corpora are reproducible from their manifests
        run: PYTHONPATH=. python tools/check_corpora.py

  # The regression gate. Fails the build when strict micro-F1 drops, when any
  # type with support >= 20 loses more than two points of F1, when adversarial
  # rejection falls, or when distractor claims rise -- on either split. A gate
  # on the aggregate alone would pass a run that quietly lost 37 points of
  # precision on one type, which is exactly what v1's "improved" run did.
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m spacy download en_core_web_md
      - name: Evaluate against the committed baseline
        run: python -m evaluation --check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t mortgage-pii:ci .
      - name: Record image size
        run: |
          docker image inspect mortgage-pii:ci --format '{{.Size}}' \
            | awk '{printf "image size %.0f MB\n", $1/1048576}'
      - name: Starts cold with no network
        run: |
          docker run -d --name pii --network none -p 8000:8000 mortgage-pii:ci
          for i in $(seq 1 60); do
            if docker exec pii python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=2)" 2>/dev/null; then
              echo "ready with no network after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "container never became ready without network access"
          docker logs pii
          exit 1
